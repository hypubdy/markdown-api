# PostgreSQL chạy local bằng Docker — dùng cho dev/chạy thật.
# Khởi động:   docker compose up -d
# Dừng:        docker compose down        (xoá container, giữ volume dữ liệu)
# Xoá sạch cả dữ liệu: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: express-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: express_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d express_app"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
